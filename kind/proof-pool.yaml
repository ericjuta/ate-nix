apiVersion: v1
kind: Namespace
metadata:
  name: ate-nix-proof
---
apiVersion: ate.dev/v1
kind: WorkerPool
metadata:
  name: nix-proof
  namespace: ate-nix-proof
  labels:
    workload: nix-proof
spec:
  replicas: 2
  # Unpatched upstream gVisor worker; prove.sh fills in the image.
  workerImage: ${WORKER_IMAGE}
  sandboxClasses:
  - name: gvisor
  template:
    resources:
      limits:
        cpu: "1"
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 1Gi
