name: cache keep-alive

# GitHub deletes a cache entry nobody restored for seven days, and a cold Nix
# build takes 51 to 64 minutes. Restoring each archive once a week keeps it.
# A schedule runs on the default branch, which is where the archives are saved.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    name: restore (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      # No checkout: the key is a prefix, so the newest archive matches.
      - id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/nix-cache
          key: nix-cache-${{ matrix.system }}-none
          restore-keys: nix-cache-${{ matrix.system }}-
      - name: Fail when there was nothing to keep
        if: steps.restore.outputs.cache-matched-key == ''
        run: |
          echo "::error::no nix-cache archive for ${{ matrix.system }}; the next push to main builds cold"
          exit 1
