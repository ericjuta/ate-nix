name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request replaces its run. A push to main waits for the
# run before it instead: a cancelled main run never saves the Nix cache, so the
# next one would compile everything again.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: nix build (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
            # The hosted ARM runner has no KVM, which the node VM test needs.
            skip: registry-free-node
    timeout-minutes: 180
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The scope step diffs against an earlier revision.
          fetch-depth: 0
      # A run that changed only documentation or licence files has nothing to
      # build, so every step below is skipped. The job still runs and reports,
      # under the same name, so a required check on it is satisfied. Anything
      # the script does not recognise builds everything.
      - id: scope
        name: Decide what to build
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          shellcheck --severity=style .github/*.sh
          .github/ci-scope.sh
      # The registry-free closure bundle and its node VM test need more disk
      # than a 72 GB hosted runner had free. The current image has 145 GB with
      # 86 to 107 GB free, and removing the toolchains took 74 to 315 s of every
      # run. Remove them only when the runner has less room than that.
      - name: Free runner disk space
        if: steps.scope.outputs.nix == 'true'
        run: |
          df -h /
          avail=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          if [ "$avail" -ge 80 ]; then
            echo "$avail GB free: nothing to remove"
            exit 0
          fi
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache /usr/share/swift \
            /usr/local/share/powershell /usr/local/share/chromium \
            /usr/lib/jvm /usr/lib/google-cloud-sdk /opt/az /opt/microsoft \
            /opt/google /usr/share/miniconda /usr/local/julia* \
            /usr/local/lib/node_modules /usr/lib/llvm-* /usr/lib/firefox \
            /home/runner/.rustup /home/runner/.cargo /opt/pipx
          sudo docker image prune --all --force >/dev/null
          df -h
      # Compiling otelcol-contrib and Jaeger needs more memory than the
      # runner has; the freed disk pays for swap.
      - name: Add swap
        if: steps.scope.outputs.nix == 'true'
        run: |
          # On /mnt when the runner has a second disk there, else on /.
          dir=/
          if mountpoint -q /mnt && [ "$(df --output=avail -BG /mnt | tail -1 | tr -dc 0-9)" -ge 24 ]; then dir=/mnt/; fi
          sudo fallocate -l 16G "${dir}ci-swap"
          sudo chmod 600 "${dir}ci-swap"
          sudo mkswap "${dir}ci-swap" >/dev/null
          sudo swapon "${dir}ci-swap"
          df -h
          free -g
          nproc
      # A binary cache of what earlier runs built, kept as one archive in the
      # repository's GitHub Actions cache, so a run compiles only what changed.
      # Every run restores it; only a push to main saves a new one, when a Nix
      # file, lock file, patch or the save script changes. `nix flake check`
      # does not download a check that a cache already holds, so the save
      # script keeps such entries from the restored archive instead of
      # reading them from the local store. A pull request that saved its own
      # 9 GB of archives would push main's out of the repository's 10 GB limit.
      - id: cache
        if: steps.scope.outputs.nix == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/nix-cache
          key: nix-cache-${{ matrix.system }}-${{ hashFiles('**/*.nix', '**/flake.lock', 'patches/**', '.github/save-nix-cache.sh') }}
          restore-keys: nix-cache-${{ matrix.system }}-
      - if: steps.scope.outputs.nix == 'true'
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          extra_nix_config: |
            extra-substituters = file:///home/runner/nix-cache?trusted=1
      # Builds every check for this system: applies each patch to its pinned
      # upstream source, compiles, runs the Go tests that the packages enable,
      # builds the images, lints the kind scripts and evaluates the NixOS module.
      # One derivation at a time: the Jaeger and Envoy builds together exceed
      # the runner's memory.
      - name: Check the flake
        if: steps.scope.outputs.nix == 'true' && !matrix.skip
        run: nix flake check -L --max-jobs 1
      - name: Build the checks, without ${{ matrix.skip }}
        if: steps.scope.outputs.nix == 'true' && matrix.skip
        env:
          SYSTEM: ${{ matrix.system }}
          SKIP: ${{ matrix.skip }}
        run: |
          nix eval --raw ".#checks.$SYSTEM" --apply "c: builtins.concatStringsSep \"\n\" (builtins.filter (n: n != \"$SKIP\") (builtins.attrNames c))" \
            | sed "s|^|.#checks.$SYSTEM.|" \
            | xargs nix build -L --max-jobs 1 --no-link
      - name: Check the reference project
        if: steps.scope.outputs.nix == 'true'
        working-directory: examples/reference
        run: nix flake check -L
      - name: Build the private-cache proof images
        if: steps.scope.outputs.nix == 'true'
        run: nix build -L --impure --file kind/private-images.nix --argstr nonce ci signed unsigned rogue
      - name: Show disk use
        if: always()
        run: df -h /
      - name: Copy what this run built into the cache
        # An archive with this exact key exists already; nothing would be saved.
        if: steps.scope.outputs.nix == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        run: |
          # The Nix daemon creates the directory as root when no archive was restored.
          sudo chown -R "$(id -u)" ~/nix-cache
          .github/save-nix-cache.sh ~/nix-cache
      # Deleting first leaves room for the other system's archive.
      - name: Delete this system's older archives
        if: steps.scope.outputs.nix == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/prune-nix-cache.sh "${{ matrix.system }}" "nix-cache-${{ matrix.system }}-${{ hashFiles('**/*.nix', '**/flake.lock', 'patches/**', '.github/save-nix-cache.sh') }}"
      - name: Save the cache
        if: steps.scope.outputs.nix == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/nix-cache
          key: nix-cache-${{ matrix.system }}-${{ hashFiles('**/*.nix', '**/flake.lock', 'patches/**', '.github/save-nix-cache.sh') }}
